<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      background: radial-gradient(circle at top, #f7a0b8, #f46f96, #ef5b88);
      overflow:hidden;
      font-family:'Cairo', sans-serif;
      position:relative;
    }

    .m-background{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      grid-template-rows:repeat(5, 1fr);
      opacity:.10;
      z-index:0;
      pointer-events:none;
    }

    .m-background span{
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:54px;
      color:#fff;
      font-weight:700;
    }

    .flower-bg{
      position:absolute;
      font-size:30px;
      opacity:.75;
      z-index:0;
      animation: float 4s ease-in-out infinite;
      pointer-events:none;
    }

    .f1{ top:8%; left:10%; }
    .f2{ top:18%; right:10%; animation-delay:.6s; }
    .f3{ bottom:22%; left:12%; animation-delay:1.2s; }
    .f4{ bottom:16%; right:11%; animation-delay:1.8s; }

    .scene{
      position:relative;
      z-index:2;
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:flex-start;
      padding-top: 250px; /* هذا هو اللي نزل الوردة فعليًا */
      text-align:center;
    }

    .flower{
      font-size:95px;
      line-height:1;
      opacity:0;
      transform: translateY(90px) scale(.2);
      animation: grow 1.8s ease forwards;
      text-shadow: 0 0 18px rgba(255,255,255,.25);
    }

    .stem{
      width:8px;
      height:0;
      margin-top:-10px;
      background: linear-gradient(#4d8a31, #1f4015);
      border-radius:20px;
      animation: stemGrow 1.8s ease forwards;
    }

    .leaves{
      position:relative;
      width:180px;
      height:70px;
      margin-top:-24px;
    }

    .leaf{
      position:absolute;
      width:46px;
      height:24px;
      background: linear-gradient(#7fd14f, #3e8b28);
      border-radius:100px 0;
      opacity:0;
      top:10px;
    }

    .left{
      left:22px;
      transform:rotate(-32deg);
      animation: leafShow .8s ease 1.2s forwards;
    }

    .right{
      right:22px;
      transform:rotate(32deg) scaleX(-1);
      animation: leafShow .8s ease 1.4s forwards;
    }

    .text{
      margin-top:34px;
      color:#fff;
      font-size:26px;
      font-weight:700;
      opacity:0;
      animation: fade .9s ease 1.9s forwards;
      text-shadow:0 2px 8px rgba(0,0,0,.12);
    }

    .btn{
      display:inline-block;
      margin-top:18px;
      padding:12px 26px;
      border-radius:30px;
      text-decoration:none;
      color:#fff;
      background: linear-gradient(45deg, #ff4f7b, #ff8eac);
      font-size:18px;
      font-weight:700;
      box-shadow:0 0 18px rgba(255,75,120,.35);
      opacity:0;
      animation: fade .9s ease 2.3s forwards;
      transition:.25s;
    }

    .btn:hover{
      transform:scale(1.05);
    }

    @keyframes grow{
      to{
        opacity:1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes stemGrow{
      from{ height:0; }
      to{ height:230px; }
    }

    @keyframes leafShow{
      to{ opacity:1; }
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @keyframes float{
      0%,100%{ transform:translateY(0); }
      50%{ transform:translateY(-10px); }
    }

    @media (max-width:600px){
      .scene{
        padding-top:115px;
      }

      .m-background span{
        font-size:40px;
      }

      .flower{
        font-size:78px;
      }

      .stem{
        width:7px;
      }

      @keyframes stemGrow{
        from{ height:0; }
        to{ height:190px; }
      }

      .leaves{
        width:145px;
        height:60px;
      }

      .leaf{
        width:38px;
        height:20px;
      }

      .text{
        font-size:20px;
        margin-top:26px;
      }

      .btn{
        font-size:15px;
        padding:11px 22px;
      }

      .flower-bg{
        font-size:24px;
      }
    }

    @media (max-width:380px){
      .scene{
        padding-top:105px;
      }

      .flower{
        font-size:70px;
      }

      .text{
        font-size:18px;
      }

      .btn{
        font-size:14px;
      }
    }
  </style>
</head>
<body>

  <div class="m-background">
    <span>M</span><span>M</span><span>M</span><span>M</span>
    <span>M</span><span>M</span><span>M</span><span>M</span>
    <span>M</span><span>M</span><span>M</span><span>M</span>
    <span>M</span><span>M</span><span>M</span><span>M</span>
    <span>M</span><span>M</span><span>M</span><span>M</span>
  </div>

  <div class="flower-bg f1">🌸</div>
  <div class="flower-bg f2">🌹</div>
  <div class="flower-bg f3">🌸</div>
  <div class="flower-bg f4">🌹</div>

  <div class="scene">
    <div class="flower">🌸</div>

    <div class="stem"></div>

    <div class="leaves">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>

    <div class="text">❤️ لأحلا ميمي</div>

    <a href="second.html" class="btn">🌹 أفتحيي</a>
  </div>

</body>
</html>
