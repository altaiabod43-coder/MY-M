<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>For You</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background: radial-gradient(circle at top, #ffb3c7, #ff6f91, #ff3d71);
      overflow:hidden;
      font-family: 'Cairo', sans-serif;
    }

    .scene{
      position:relative;
      text-align:center;
      width:100%;
      max-width:500px;
      min-height:100vh;
      padding:50px 20px 35px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
    }

    .flower{
      font-size:110px;
      opacity:0;
      transform: translateY(110px) scale(0.2);
      animation: grow 2s ease forwards;
      line-height:1;
      margin-top:20px;
      text-shadow: 0 0 20px rgba(255,255,255,.25);
    }

    .stem{
      width:6px;
      height:0;
      background: linear-gradient(#4d7c35, #1e2d18);
      margin: -8px auto 0;
      border-radius:10px;
      animation: stemGrow 2s ease forwards;
    }

    .leaves{
      position:relative;
      width:160px;
      height:60px;
      margin:0 auto;
    }

    .leaf{
      width:42px;
      height:22px;
      background: linear-gradient(#8ccf52, #3c6b22);
      position:absolute;
      border-radius:100px 0;
      opacity:0;
      top:8px;
    }

    .left{
      left:28px;
      transform: rotate(-30deg);
      animation: leafShow .8s ease 1.5s forwards;
    }

    .right{
      right:28px;
      transform: rotate(30deg) scaleX(-1);
      animation: leafShow .8s ease 1.7s forwards;
    }

    .text{
      color:white;
      font-size:28px;
      margin-top:18px;
      opacity:0;
      animation: fade 1s ease 2.3s forwards;
      text-shadow: 0 2px 8px rgba(0,0,0,.15);
    }

    .btn{
      display:inline-block;
      margin-top:22px;
      padding:14px 28px;
      border-radius:30px;
      text-decoration:none;
      color:white;
      background: linear-gradient(45deg, #ff4d79, #ff87a5);
      font-size:18px;
      font-weight:700;
      box-shadow: 0 0 20px rgba(255,75,120,.35);
      opacity:0;
      animation: fade 1s ease 2.8s forwards;
      transition: 0.25s;
    }

    .btn:hover{
      transform: scale(1.05);
      box-shadow: 0 0 28px rgba(255,75,120,.55);
    }

    @keyframes grow{
      to{
        opacity:1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes stemGrow{
      from{ height:0; }
      to{ height:150px; }
    }

    @keyframes leafShow{
      to{ opacity:1; }
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(12px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    @media (max-width:600px){
      .scene{
        padding:70px 16px 30px;
      }

      .flower{
        font-size:82px;
        margin-top:10px;
        transform: translateY(90px) scale(0.2);
      }

      .stem{
        width:5px;
      }

      @keyframes stemGrow{
        from{ height:0; }
        to{ height:120px; }
      }

      .leaves{
        width:130px;
        height:50px;
      }

      .leaf{
        width:34px;
        height:18px;
      }

      .left{
        left:22px;
      }

      .right{
        right:22px;
      }

      .text{
        font-size:20px;
        margin-top:14px;
      }

      .btn{
        font-size:15px;
        padding:12px 22px;
        margin-top:18px;
      }
    }

    @media (max-width:380px){
      .scene{
        padding-top:85px;
      }

      .flower{
        font-size:72px;
      }

      .text{
        font-size:18px;
      }

      .btn{
        font-size:14px;
        padding:11px 20px;
      }
    }
  </style>
</head>
<body>

  <div class="scene">
    <div class="flower">🌸</div>

    <div class="stem"></div>

    <div class="leaves">
      <div class="leaf left"></div>
      <div class="leaf right"></div>
    </div>

    <div class="text">❤️ لأحلا ميمي</div>

    <a href="second.html" class="btn">🌹 أفتحيي</a>
  </div>

</body>
</html>
