<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      background: linear-gradient(180deg, #ff9fba, #ff5c8a);
      font-family:'Cairo', sans-serif;
    }

    .box{
      width:min(92%, 420px);
      background: rgba(255,255,255,0.16);
      border-radius:24px;
      padding:24px 16px;
      text-align:center;
      color:white;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 25px rgba(0,0,0,.15);
    }

    .text{
      font-size:22px;
      font-weight:700;
      margin-bottom:16px;
    }

    audio{
      width:100%;
      margin:14px 0 18px;
      border-radius:12px;
    }

    .btn{
      display:inline-block;
      padding:12px 24px;
      border-radius:25px;
      background:#fff;
      color:#ff4d79;
      text-decoration:none;
      font-weight:700;
    }

    @media (max-width:600px){
      .text{
        font-size:18px;
      }
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="text">🎵 هاي الأغنية إلج 🥺❤️</div>

    <audio controls loop>
      <source src="formym.mp3" type="audio/mpeg">
      متصفحك ما يدعم تشغيل الصوت.
    </audio>

    <a href="index.html" class="btn">رجوع</a>
  </div>

</body>
</html>
