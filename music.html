<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
      font-family:'Cairo', sans-serif;
      color:white;
      text-align:center;
      position:relative;
      overflow:hidden;
      background:
        radial-gradient(circle at top, #1a245c 0%, #0d1438 35%, #070b20 70%, #03050f 100%);
    }

    /* خلفية حرف M */
    .m-background{
      position:absolute;
      inset:0;
      display:grid;
      grid-template-columns:repeat(5, 1fr);
      grid-template-rows:repeat(6, 1fr);
      opacity:.08;
      z-index:0;
      pointer-events:none;
    }

    .m-background span{
      display:flex;
      justify-content:center;
      align-items:center;
      font-size:clamp(28px, 5vw, 58px);
      color:#ffffff;
      font-weight:700;
      animation: floatM 6s ease-in-out infinite;
    }

    /* النجوم */
    .star{
      position:absolute;
      width:4px;
      height:4px;
      background:white;
      border-radius:50%;
      box-shadow:0 0 8px rgba(255,255,255,.9);
      animation: twinkle 2.5s ease-in-out infinite;
      z-index:0;
      pointer-events:none;
    }

    .s1{ top:8%; left:12%; animation-delay:.2s; }
    .s2{ top:14%; left:28%; animation-delay:1.1s; }
    .s3{ top:10%; right:18%; animation-delay:.7s; }
    .s4{ top:24%; right:8%; animation-delay:1.8s; }
    .s5{ top:32%; left:18%; animation-delay:1.4s; }
    .s6{ top:40%; left:8%; animation-delay:.5s; }
    .s7{ top:48%; right:16%; animation-delay:2s; }
    .s8{ top:58%; left:22%; animation-delay:1.2s; }
    .s9{ top:66%; right:10%; animation-delay:.9s; }
    .s10{ top:78%; left:14%; animation-delay:1.7s; }
    .s11{ top:84%; right:24%; animation-delay:2.3s; }
    .s12{ top:20%; left:50%; animation-delay:1.5s; }

    /* كواكب */
    .planet{
      position:absolute;
      border-radius:50%;
      z-index:0;
      pointer-events:none;
      animation: floatPlanet 6s ease-in-out infinite;
      box-shadow:0 0 20px rgba(255,255,255,.08);
    }

    .planet1{
      width:80px;
      height:80px;
      top:9%;
      right:8%;
      background:radial-gradient(circle at 30% 30%, #ffd6a5, #ff9f5a, #d96b2b);
    }

    .planet2{
      width:56px;
      height:56px;
      bottom:12%;
      left:8%;
      background:radial-gradient(circle at 30% 30%, #d9c6ff, #8b7bff, #4a3dc4);
      animation-delay:1.2s;
    }

    .planet3{
      width:42px;
      height:42px;
      top:22%;
      left:10%;
      background:radial-gradient(circle at 30% 30%, #c8fff4, #51d0c8, #1b7c85);
      animation-delay:2s;
    }

    .ring{
      position:absolute;
      border:2px solid rgba(255,255,255,.35);
      border-radius:50%;
      transform:rotate(-20deg);
    }

    .planet1 .ring{
      width:105px;
      height:26px;
      top:26px;
      left:-12px;
    }

    /* صندوق الأغنية */
    .box{
      position:relative;
      z-index:2;
      width:min(90%, 430px);
      background: rgba(255,255,255,0.12);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:24px;
      padding:24px 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,.25);
    }

    .text{
      font-size:24px;
      font-weight:700;
      margin-bottom:18px;
      text-shadow:0 2px 10px rgba(0,0,0,.25);
    }

    audio{
      width:100%;
      margin-top:10px;
      margin-bottom:18px;
      border-radius:12px;
    }

    .btn{
      display:inline-block;
      padding:12px 25px;
      border-radius:25px;
      background:linear-gradient(45deg, #7c8cff, #b06cff);
      color:white;
      text-decoration:none;
      font-weight:700;
      transition:.25s;
      box-shadow:0 0 18px rgba(124,140,255,.35);
    }

    .btn:hover{
      transform:scale(1.05);
    }

    @keyframes twinkle{
      0%,100%{
        opacity:.25;
        transform:scale(.8);
      }
      50%{
        opacity:1;
        transform:scale(1.4);
      }
    }

    @keyframes floatPlanet{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-10px);
      }
    }

    @keyframes floatM{
      0%,100%{
        transform:translateY(0);
      }
      50%{
        transform:translateY(-6px);
      }
    }

    @media (max-width:600px){
      .text{
        font-size:20px;
      }

      .box{
        padding:20px 14px;
      }

      .planet1{
        width:62px;
        height:62px;
      }

      .planet1 .ring{
        width:82px;
        height:20px;
        top:20px;
        left:-10px;
      }

      .planet2{
        width:44px;
        height:44px;
      }

      .planet3{
        width:34px;
        height:34px;
      }

      .m-background span{
        font-size:34px;
      }
    }
  </style>
</head>
<body>

  <!-- حرف M -->
  <div class="m-background">
    <span>M</span><span>M</span><span>M</span><span>M</span><span>M</span>
    <span>M</span><span>M</span><span>M</span><span>M</span><span>M</span>
    <span>M</span><span>M</span><span>M</span><span>M</span><span>M</span>
    <span>M</span><span>M</span><span>M</span><span>M</span><span>M</span>
    <span>M</span><span>M</span><span>M</span><span>M</span><span>M</span>
    <span>M</span><span>M</span><span>M</span><span>M</span><span>M</span>
  </div>

  <!-- نجوم -->
  <div class="star s1"></div>
  <div class="star s2"></div>
  <div class="star s3"></div>
  <div class="star s4"></div>
  <div class="star s5"></div>
  <div class="star s6"></div>
  <div class="star s7"></div>
  <div class="star s8"></div>
  <div class="star s9"></div>
  <div class="star s10"></div>
  <div class="star s11"></div>
  <div class="star s12"></div>

  <!-- كواكب -->
  <div class="planet planet1">
    <div class="ring"></div>
  </div>
  <div class="planet planet2"></div>
  <div class="planet planet3"></div>

  <!-- الصندوق -->
  <div class="box">
    <div class="text">هاي الأغنية إلج 🥺❤️</div>

    <audio controls autoplay loop>
      <source src="formym.mp3" type="audio/mpeg">
      متصفحك ما يدعم تشغيل الصوت.
    </audio>

    <a href="index.html" class="btn">احبج</a>
  </div>

</body>
</html>
