<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music</title>

  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      flex-direction:column;
      background: linear-gradient(180deg, #ff9fba, #ff5c8a);
      font-family:'Cairo', sans-serif;
      color:white;
      text-align:center;
      padding:20px;
    }

    .box{
      width:min(90%, 420px);
      background: rgba(255,255,255,0.15);
      border-radius:24px;
      padding:24px 18px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 24px rgba(0,0,0,.15);
    }

    .text{
      font-size:24px;
      font-weight:700;
      margin-bottom:18px;
    }

    audio{
      width:100%;
      margin-top:10px;
      margin-bottom:18px;
      border-radius:12px;
    }

    .btn{
      display:inline-block;
      padding:12px 25px;
      border-radius:25px;
      background:#fff;
      color:#ff4d79;
      text-decoration:none;
      font-weight:700;
      transition:.25s;
    }

    .btn:hover{
      transform:scale(1.05);
    }

    @media (max-width:600px){
      .text{
        font-size:20px;
      }

      .box{
        padding:20px 14px;
      }
    }
  </style>
</head>
<body>

  <div class="box">
    <div class="text">هاي الأغنية إلج 🥺❤️</div>

    <audio controls loop>
      <source src="formym.mp3" type="audio/mpeg">
      متصفحك ما يدعم تشغيل الصوت.
    </audio>

    <a href="index.html" class="btn">احبج</a>
  </div>

</body>
</html>
